name: Build
on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build
        run: dotnet build qowaiv.slnx --configuration Release

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # Needed by dorny/test-reporter to publish the check run
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Empty for fork and Dependabot PRs
      SONAR_SCANNER_VERSION: 12.0.0 # dotnet-sonarscanner; part of the cache key, so bumping it reinstalls
      TUNIT_DISABLE_LOGO: true # Keeps the test output readable
      TUNIT_DISABLE_ARTIFACT_UPLOAD: true # The merged report is uploaded below instead
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ env.SONAR_SCANNER_VERSION }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}

      - name: Install SonarCloud scanner
        if: env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool install dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION" --tool-path ./.sonar/scanner

      - name: Start SonarCloud scanner
        id: sonar-begin
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
          /k:"Qowaiv_Qowaiv" \
          /o:"qowaiv" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.cobertura.reportsPaths="TestResults/merged/*.cobertura.xml" \
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"

      - name: Build
        run: dotnet build qowaiv.slnx --configuration Release

      - name: Test
        run: |
          dotnet test --solution qowaiv.slnx --configuration Release --no-build \
          --report-trx \
          --coverage --coverage-output-format cobertura

      - name: Stop SonarCloud scanner
        if: ${{ !cancelled() && steps.sonar-begin.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end \
          /d:sonar.token="$SONAR_TOKEN"

      - name: Upload HTML test report
        id: test-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: ${{ runner.temp }}/tunit-aggregate/**/merged-report.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Link HTML test report
        if: ${{ !cancelled() && steps.test-report.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.test-report.outputs.artifact-url }}
        run: echo "📄 [HTML test report]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Report
        # Fork and Dependabot PRs have a read-only token, which cannot create check runs.
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Unit test results
          path: "TestResults/*.trx"
          reporter: dotnet-trx
          use-actions-summary: false # Publish a check run with annotations instead
          fail-on-empty: false # A failing build means there are no results to report
