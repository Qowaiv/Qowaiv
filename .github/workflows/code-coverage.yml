name: Code coverage
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Generate coverage report
        run: |
          dotnet test --solution qowaiv.slnx \
          --configuration Release \
          --coverage --coverage-output-format cobertura
      - name: Merge coverage reports
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 --tool-path ./.report-generator
          ./.report-generator/reportgenerator \
          -reports:"TestResults/merged/*.cobertura.xml" \
          -targetdir:"coverage" \
          -reporttypes:Cobertura
      - name: Publish coverage report to coveralls.io
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/Cobertura.xml
          format: cobertura
