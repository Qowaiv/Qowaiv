name: Code coverage
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate coverage report
        run: |
          dotnet test ./specs/Qowaiv.Specs -f net10.0 \
          --configuration Release \
          --collect:"XPlat Code Coverage;Format=cobertura"
      - name: Get path to coverage file
        shell: bash
        run: echo "COVERAGE_PATH=$(find "$GITHUB_WORKSPACE/specs/Qowaiv.Specs/TestResults" -name coverage.cobertura.xml)" >> $GITHUB_ENV
      - name: Publish coverage report to coveralls.io
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.COVERAGE_PATH }}
          format: cobertura
