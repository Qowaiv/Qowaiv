name: Dependabot lock files

# Repairs packages.lock.json after a Dependabot update; Dependabot leaves it
# broken for projects with more than one target framework: it keeps the
# section of only one of them.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - Directory.Packages.props
      - "**/*.csproj"
      - "**/packages.lock.json"

concurrency:
  group: dependabot-lock-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock-files:
    name: Regenerate lock files
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      # Dependabot deletes the branch when it abandons a pull request, which can
      # happen while this job is starting.
      - name: Check branch
        id: check
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" "$BRANCH" > /dev/null \
            && echo "exists=true" >> "$GITHUB_OUTPUT" \
            || echo "Branch is gone; nothing to do."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.exists
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup .NET SDK
        if: steps.check.outputs.exists
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Regenerate lock files
        if: steps.check.outputs.exists
        run: dotnet restore qowaiv.slnx --force-evaluate

      # A push made with GITHUB_TOKEN does not start a new Build run; the push to
      # master after merging does.
      - name: Push lock files
        if: steps.check.outputs.exists
        run: |
          if git diff --quiet -- '*packages.lock.json'; then
            echo "Lock files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*packages.lock.json'
          git commit -m "Regenerate packages.lock.json for all target frameworks"
          git push
