name: Release
on:
  push:
    tags:
      - 'v*'
env:
  NUGET_FEED: https://api.nuget.org/v3/index.json
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build
        run: dotnet build qowaiv.slnx --configuration Release

      - name: Test
        run: dotnet test --solution qowaiv.slnx --configuration Release --no-build

      - name: DotNet Pack
        run: dotnet pack qowaiv.slnx --no-build --no-restore -c Release --output packages

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: |
            packages/*.nupkg
            packages/*.snupkg

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # Needed to create the GitHub release
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg

      - name: DotNet NuGet Push
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --source "$NUGET_FEED" --api-key "$NUGET_KEY" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            ./*.nupkg ./*.snupkg
